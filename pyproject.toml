[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ics-schedule"
version = "0.2.0"
description = "Plugin-based calendar aggregation and subscription server"
requires-python = ">=3.9"
dependencies = ["icalendar>=6.1,<7", "tzdata>=2024.1"]

[project.scripts]
ics-schedule = "ics_schedule.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ics_schedule*"]

[tool.setuptools.package-data]
ics_schedule = ["static/*"]
