[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ics-schedule"
version = "0.2.0"
description = "Plugin-based calendar aggregation and subscription server"
requires-python = ">=3.9"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "curl_cffi>=0.13,<0.15",
  "icalendar>=6.1,<7",
  "tzdata>=2024.1",
]

[project.scripts]
ics-schedule = "ics_schedule.server:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["ics_schedule*"]

[tool.setuptools.package-data]
ics_schedule = ["static/*"]
